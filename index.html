<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="WeatherMap - search any place and see its live weather on the map.">
  <title>WeatherMap</title>

  <!-- Leaflet map library styles -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
 
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <!-- Our own styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <h1 class="site-title">WeatherMap</h1>
    <p class="site-tagline">Live weather for any place on Earth</p>
  </header>

  <main class="map-area">

    <section class="search-card" aria-label="Search location">
      <form id="search-form" class="search-form" role="search">
        <label for="location-input" class="visually-hidden">Location</label>
        <input
          type="text"
          id="location-input"
          class="search-input"
          placeholder="City, address or landmark..."
          autocomplete="off">
        <button type="submit" id="search-btn" class="search-btn">Get Weather</button>
      </form>

      <div id="alert-box" class="alert-box hidden" role="alert"></div>
    </section>

    <div id="loader" class="loader hidden" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>

    <div id="map"></div>

  </main>

  <footer class="site-footer">
    <p>Made by Samar · Advanced Web Technologies · SUST</p>
  </footer>

  <!-- Scripts: order matters -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
